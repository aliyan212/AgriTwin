<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1710" />
      <stop offset="50%" stop-color="#070c09" />
      <stop offset="100%" stop-color="#020403" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card / Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="4" />

  <!-- Outer Orbit Twin Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="16 8" transform="rotate(-30 256 256)" opacity="0.6" />
  
  <!-- Secondary Orbit Node -->
  <circle cx="390" cy="180" r="10" fill="#34d399" filter="url(#glow)" />
  <circle cx="122" cy="332" r="6" fill="#10b981" opacity="0.8" />

  <!-- Digital Grid / Radar Rings -->
  <circle cx="256" cy="270" r="120" fill="none" stroke="#34d399" stroke-opacity="0.1" stroke-width="2" />
  <circle cx="256" cy="270" r="70" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-width="2" />

  <!-- Central Sprout (AgriTwin Motif) -->
  <g transform="translate(256, 280) scale(1.6)" filter="url(#glow)">
    <!-- Stem -->
    <path d="M0 45 L0 -10 Q0 -45 25 -70" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M0 -5 C-30 -15 -45 -55 -15 -75 C5 -55 0 -20 0 -5 Z" fill="url(#brandGrad)" />
    <!-- Right Leaf -->
    <path d="M12 -35 C35 -50 55 -40 50 -15 C30 -5 15 -20 12 -35 Z" fill="#6ee7b7" opacity="0.9" />
    <!-- Satellite Pulse Beacon -->
    <circle cx="25" cy="-70" r="7" fill="#ffffff" />
    <!-- Field Ground Baseline -->
    <path d="M-50 45 L50 45" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Signal Arcs (Satellite Link) -->
  <path d="M265 140 A 30 30 0 0 1 310 165" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <path d="M255 120 A 55 55 0 0 1 335 165" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.4" />
</svg>
